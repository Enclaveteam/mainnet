[package]
version = "0.1.0"
name = "zstable-settlement-guest-script"
edition = "2021"
default-run = "zstable-settlement-guest"

[[bin]]
name = "zstable-settlement-guest"
path = "src/bin/main.rs"

[[bin]]
name = "evm"
path = "src/bin/evm.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[[bin]]
name = "sequencer"
path = "src/bin/sequencer.rs"

[[bin]]
name = "shielded-sequencer"
path = "src/bin/shielded_sequencer.rs"

[[bin]]
name = "compliance-unseal"
path = "src/bin/compliance_unseal.rs"

[dependencies]
# native-gnark (real Groth16 proving) needs Go >= 1.24; installed Go here is 1.18.1. Dropped for
# now since --execute validation doesn't need it; re-add once a real proof must be generated.
sp1-sdk = { version = "6.0.1", features = ["blocking", "network"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.200", default-features = false, features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
hex = "0.4.3"
alloy-sol-types = { workspace = true }
alloy-primitives = "*"
zstable-settlement-guest-lib = { path = "../lib" }
zstable-settlement-executor = { path = "../../settlement-executor" }
revm = { version = "43", features = ["serde"] }
dotenv = "0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# shielded-sequencer server + sealed-order channel (browser -> enclave)
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# In-enclave attestation bound to the sealing key (user_data/public_key = P-256 pubkey).
aws-nitro-enclaves-nsm-api = "0.4"
serde_bytes = "0.11"

[build-dependencies]
sp1-build = { version = "6.0.1" }
